<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
    <title>加班记录 · 打工人专用</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary: #5866ef;
            --accent: #9a49fa;
            --danger: #fa4856;
            --warning: #ffb902;
            --bg: #f7faff;
            --header-gradient: linear-gradient(90deg, #5668dd 0%, #a97df8 100%);
            --radius: 60px;
            --shadow: 0 4px 24px 0 #728dff33;
            --cell-bg: #eef3fb;
            --cell-holiday: #f8f2ff;
            --cell-pubholiday: #fff3e0;
            --font: "Segoe UI", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
            --progress-bg: #e7eeff;
            --overtime-bar: linear-gradient(90deg, #5668dd 0%, #6fd6fa 100%);
            --block-padding: 12px;
            --headline: 1.30em;
            --pubholiday-accent: #f0803c;
            --nav-btn-bg: #ffffff;
            --nav-btn-border: #d4dcfa;
            --nav-btn-active: #e9efff;
            --card-radius: 18px;
            --icon-radius: 13px;
        }
        body {
            min-height: 100vh;
            margin: 0;
            background: var(--bg);
            font-family: var(--font);
            color: #24284f;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .top-capsule {
            background: var(--header-gradient);
            border-radius: var(--radius);
            box-shadow: 0 10px 28px rgba(86,104,221,0.35), 0 4px 12px rgba(0,0,0,0.08), inset 0 2px 6px rgba(255,255,255,0.35);
            margin: 10px 16px 18px 16px;
            position: sticky;
            top: 12px;
            z-index: 10;
            display: flex;
            align-items: center;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.25);
        }
        .inner-small {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            padding: 8px 16px;
            margin: 6px 0 6px 8px;
            font-weight: bold;
            font-size: 1.1em;
            color: white;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.35);
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            position: relative;
            z-index: 4;
            flex-shrink: 0;
        }
        .inner-small i { font-size: 0.9em; }
        .marquee-container {
            flex: 1;
            overflow: hidden;
            padding: 10px 8px;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 1;
            -webkit-mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.25) 10px, black 22px, black 100%);
            mask-image: linear-gradient(to right, transparent 0%, rgba(0,0,0,0.25) 10px, black 22px, black 100%);
            min-height: 0;
        }
        .marquee-container marquee {
            font-size: var(--headline);
            font-weight: bold;
            letter-spacing: .10em;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.25), 0 0 20px rgba(255,255,255,0.15);
            white-space: nowrap;
            line-height: 1;
            display: block;
        }
        main {
            max-width: 525px;
            margin: auto;
            padding: 6px 8px 18px 8px;
            width: 100%;
            flex: 1;
        }
        .progress-area { margin-bottom: 16px; position: relative; }
        .period-label { color: #4d60ad; font-weight: 500; text-align: center; margin: 2px 0 6px 0; font-size: .97em; }
        .period-nav { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 8px 0 10px 0; }
        .period-nav button {
            background: var(--nav-btn-bg); border: 1.5px solid var(--nav-btn-border); color: var(--primary);
            border-radius: 22px; padding: 6px 14px; font-size: 0.9em; font-weight: 500; cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s; box-shadow: 0 2px 6px rgba(0,0,0,0.04); letter-spacing: .3px;
        }
        .period-nav button:hover { background: var(--nav-btn-active); box-shadow: 0 4px 10px rgba(88,102,239,0.15); }
        .period-nav button:active { transform: scale(0.97); }
        .progress-bg { position: relative; width: 100%; height: 14px; background: var(--progress-bg); border-radius: 8px; overflow: visible; margin-bottom: 3px; }
        .progress-inner { height: 100%; background: var(--header-gradient); width: 0%; transition: width 0.8s cubic-bezier(0.7, 0, 0.3, 1); border-radius: 8px; box-shadow: 0 2px 8px #7275bd2a; position: relative; }
        .progress-icon { position: absolute; top: 50%; transform: translate(-50%, -50%); font-size: 20px; color: #ffffff; text-shadow: 0 0 6px rgba(86,104,221,0.8), 0 0 3px #00000055; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3)); pointer-events: none; z-index: 2; transition: left 0.8s cubic-bezier(0.7, 0, 0.3, 1); }
        .calendar { background: #fff; border-radius: var(--card-radius); padding: var(--block-padding) 4px 12px 4px; box-shadow: var(--shadow); margin-bottom: 18px; overflow-x: auto; touch-action: manipulation; }
        .calendar-header, .calendar-row { display: grid; grid-template-columns: repeat(7, 1fr); align-items: center; }
        .calendar-header span { color: var(--primary); font-weight: 600; font-size: 1em; text-align: center; padding: 2px 0; }
        /* 基础单元格：增加下凹内阴影 */
        .calendar-cell {
            min-width: 38px;
            height: 48px;
            background: var(--cell-bg);
            margin: 1.5px 0;
            border-radius: 9px;
            font-size: 1em;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: border .16s, box-shadow .13s, background .18s;
            border: 2.2px solid transparent;
            overflow: hidden;
            user-select: none;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.06), inset 0 -1px 2px rgba(255,255,255,0.9);
        }
        .calendar-cell.today {
            border: 2.2px solid var(--primary);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.06), inset 0 -1px 2px rgba(255,255,255,0.9);
        }
        .calendar-cell[data-weekend="1"]:not([data-pubholiday="1"]) {
            background: var(--cell-holiday);
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.06), inset 0 -1px 2px rgba(255,255,255,0.9);
        }
        /* 国假单元格：叠加标记阴影 */
        .calendar-cell[data-pubholiday="1"] {
            background: var(--cell-pubholiday);
            border-color: #f5cfa0;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.06), inset 0 -1px 2px rgba(255,255,255,0.9), inset 0 0 0 1px #fad8b5;
        }
        .calendar-cell.user-override-workday {
            background: #eef3fb;
            border-left: 3px solid #5866ef;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.06), inset 0 -1px 2px rgba(255,255,255,0.9);
        }
        .calendar-cell.user-override-holiday {
            background: #f8f2ff;
            border-left: 3px solid #9a49fa;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.06), inset 0 -1px 2px rgba(255,255,255,0.9);
        }
        .calendar-cell.user-override-publicholiday {
            background: #fff3e0;
            border-left: 3px solid #f0803c;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.06), inset 0 -1px 2px rgba(255,255,255,0.9);
        }
        .cell-date { font-weight: 500; font-size: 1.05em; position: relative; }
        .cell-ot-bar-bg { margin-top: 0.5em; width: 82%; height: 7px; background: #e5e5ee; border-radius: 7px; overflow: hidden; }
        .cell-ot-bar { height: 100%; transition: width .25s; background: var(--overtime-bar); box-shadow: 0 1px 4px #5668dd35; min-width: 1.5px; }
        .cell-ot-bar.warn { background: var(--warning); }
        .cell-ot-bar.full { background: var(--danger); }
        .cell-ot-num { margin: .18em 0 0 0; font-size: 1.05em; color: #24284f; font-weight: 800; }
        .cell-blank { background: none; pointer-events: none; box-shadow: none; }
        .stats-columns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: center; margin-bottom: 16px; padding: 0 4px; }
        .stat-card {
            background: #f0f2f7;
            border-radius: 16px;
            padding: 12px 6px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.06), inset 0 -1px 2px rgba(255,255,255,0.8);
            transition: box-shadow 0.25s;
        }
        .stat-card:hover {
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.1), inset 0 -1px 2px rgba(255,255,255,0.7);
        }
        .stat-card i { font-size: 1.6em; display: block; margin-bottom: 6px; }
        .stat-card .stat-label { font-size: 0.85em; font-weight: 600; color: #6c7bbd; margin-bottom: 4px; }
        .stat-card .stat-hours { font-size: 1.7em; font-weight: 800; color: var(--primary); line-height: 1.2; font-variant-numeric: tabular-nums; }
        .stat-card .stat-multiplier { font-size: 0.75em; color: #a0a9cf; }
        .total-row-salary { border-top: 1.5px dashed #dde3f8; padding-top: 12px; margin-top: 4px; font-size: 1.2em; text-align: center; }
        .summary { background: #fff; border-radius: var(--card-radius); box-shadow: var(--shadow); padding: var(--block-padding) 10px 10px 10px; margin-bottom: 12px; }
        .chart-card { background: #fff; border-radius: var(--card-radius); box-shadow: var(--shadow); padding: 16px 12px 18px 12px; margin-bottom: 20px; }
        .chart-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; padding: 0 4px; }
        .chart-header .chart-title { font-weight: 600; color: var(--primary); font-size: 0.95rem; letter-spacing: 0.3px; }
        .ios-switch { display: flex; background: #eef3fc; border-radius: 32px; padding: 3px; gap: 2px; }
        .switch-option { font-size: 0.75rem; font-weight: 500; padding: 6px 14px; border-radius: 30px; background: transparent; color: #5668dd; border: none; cursor: pointer; transition: all 0.2s ease; letter-spacing: 0.3px; }
        .switch-option.active { background: #ffffff; color: #2f3bb3; box-shadow: 0 2px 8px rgba(0,0,0,0.05); font-weight: 600; }
        canvas#trendChart { display: block; margin: 0 auto; width: 100%; background: #fefefe; border-radius: 16px; }
        .chart-note { font-size: 0.7rem; text-align: center; color: #9aa9ce; margin-top: 12px; background: #f5f9fe; display: inline-block; width: auto; margin-left: auto; margin-right: auto; padding: 4px 12px; border-radius: 20px; }
        .modal-mask { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 1000; display: none; align-items: center; justify-content: center; }
        .ios-alert { background: linear-gradient(135deg, #ffffff 0%, #f5f3ff 100%); border-radius: 32px; width: 290px; max-width: 85vw; padding: 28px 22px 24px; box-shadow: 0 25px 45px rgba(86,104,221,0.3), 0 4px 12px rgba(0,0,0,0.1); text-align: center; animation: fadeInScale 0.2s ease; border: 1px solid rgba(88,102,239,0.2); }
        @keyframes fadeInScale { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .ios-alert h2 { font-size: 1.8rem; font-weight: 700; margin: 0 0 12px 0; background: var(--header-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: -0.3px; }
        .ios-alert .feature-list { text-align: left; margin: 20px 0 24px; padding-left: 6px; }
        .ios-alert .feature-list p { margin: 12px 0; font-size: 0.95rem; color: #2c2e5a; display: flex; align-items: center; gap: 12px; }
        .ios-alert .feature-list i { width: 24px; color: var(--primary); font-size: 1.1rem; text-align: center; }
        .ios-alert .confirm-btn { background: var(--header-gradient); border: none; padding: 12px 0; width: 100%; border-radius: 44px; font-size: 1rem; font-weight: 600; color: white; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(86,104,221,0.4); }
        .ios-alert .confirm-btn:active { transform: scale(0.97); opacity: 0.9; }
        .modal { background: #fff; border-radius: 28px; box-shadow: var(--shadow); padding: 24px 22px 22px; min-width: 260px; max-width: 90vw; display: flex; flex-direction: column; align-items: stretch; font-size: 1.05em; animation: fadein .22s; }
        @keyframes fadein { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
        .modal label { color: #8693e7; text-align: center; line-height: 1.5; margin-bottom: 12px; font-weight: 500; }
        .modal .type-badge { display: inline-block; background: #f0f4fe; padding: 4px 12px; border-radius: 40px; font-size: 0.85rem; margin-top: 4px; }
        .modal input[type='number'] { width: 100%; font-size: 1.2rem; padding: 10px 0; text-align: center; border: 2px solid #dce3fc; background: #f6f8fd; border-radius: 32px; color: var(--primary); font-weight: 600; margin-bottom: 16px; }
        .fold-section { background: #f8faff; border-radius: 20px; margin: 8px 0 12px; overflow: hidden; }
        .fold-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; cursor: pointer; color: var(--primary); font-weight: 500; font-size: 0.9rem; transition: background 0.15s; }
        .fold-header:hover { background: #eef3ff; }
        .fold-header i { transition: transform 0.2s; font-size: 0.9rem; }
        .fold-content { max-height: 0; overflow: hidden; transition: max-height 0.25s ease-out; padding: 0 12px; }
        .fold-content.open { max-height: 150px; padding: 8px 12px 16px; }
        .type-buttons { display: flex; gap: 10px; justify-content: space-between; }
        .type-btn { flex: 1; background: white; border: 1.5px solid #cdd9fc; border-radius: 40px; padding: 8px 0; font-size: 0.85rem; font-weight: 500; color: #3d4f9c; cursor: pointer; transition: all 0.15s; text-align: center; }
        .type-btn.active { background: var(--primary); border-color: var(--primary); color: white; box-shadow: 0 2px 8px rgba(88,102,239,0.3); }
        .modal-btns { display: flex; gap: 12px; margin-top: 8px; }
        .modal button { flex: 1; padding: 10px 0; border: none; border-radius: 44px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .modal .save-btn { background: var(--primary); color: #fff; }
        .modal .cancel-btn { background: #eef2fc; color: #5866ef; }
        .salary-card { background: #fff; border-radius: var(--card-radius); box-shadow: var(--shadow); padding: 8px 16px; margin-bottom: 12px; }
        .input-group { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: nowrap; }
        .wage-label-wrapper { display: flex; align-items: center; gap: 8px; background: #f0f4fe; padding: 6px 14px; border-radius: 40px; color: var(--primary); font-weight: 500; white-space: nowrap; }
        .wage-label-wrapper .icon-box { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; background: rgba(88,102,239,0.1); border-radius: var(--icon-radius); flex-shrink: 0; font-size: 1rem; color: var(--primary); }
        .wage-label-wrapper span { font-size: 0.85rem; }
        .wage-input-wrapper { display: flex; align-items: center; gap: 4px; background: #f8faff; border-radius: 48px; padding: 2px 8px 2px 14px; border: 1px solid #e0e7fc; transition: all 0.2s; flex-shrink: 1; }
        .wage-input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(88,102,239,0.15); background: #ffffff; }
        .wage-input-wrapper .currency { font-size: 1rem; font-weight: 600; color: var(--primary); }
        #hourly-wage { width: 80px; padding: 7px 0; font-size: 0.95rem; font-weight: 600; text-align: center; border: none; background: transparent; color: #2c3e66; outline: none; }
        #hourly-wage::-webkit-inner-spin-button, #hourly-wage::-webkit-outer-spin-button { opacity: 0.5; }
        .input-group button { background: var(--header-gradient); border: none; padding: 7px 16px; border-radius: 44px; font-size: 0.8rem; font-weight: 600; color: white; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s; box-shadow: 0 2px 8px rgba(86,104,221,0.3); display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; }
        .input-group button .btn-icon-box { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; background: rgba(255,255,255,0.22); border-radius: 9px; flex-shrink: 0; font-size: 0.9rem; }
        .input-group button:active { transform: scale(0.96); box-shadow: 0 1px 4px rgba(86,104,221,0.4); }
        .footer-motto {
            text-align: center;
            padding: 12px 16px 8px;
            color: #5b6ab0;
            font-size: 0.85rem;
            letter-spacing: 0.6px;
            border-top: 1px solid #eef2fc;
            margin-top: 8px;
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .footer-motto .motto-text {
            font-style: italic;
            font-weight: 500;
            color: #3d4b8a;
        }
        .days-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #f0f4fe;
            border-radius: 32px;
            padding: 5px 14px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--primary);
            white-space: nowrap;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
            border: 1px solid #dce3fc;
        }
        .days-badge i { font-size: 0.9rem; }
        .footer-note {
            font-size: 0.68rem;
            color: #9aa3c0;
            margin-top: 2px;
        }
        @media (max-width: 500px) {
            .input-group { gap: 6px; }
            .wage-label-wrapper { padding: 4px 10px; }
            .wage-label-wrapper span { font-size: 0.75rem; }
            .wage-label-wrapper .icon-box { width: 28px; height: 28px; font-size: 0.85rem; }
            #hourly-wage { width: 70px; font-size: 0.85rem; }
            .input-group button { padding: 6px 12px; font-size: 0.75rem; }
            .input-group button .btn-icon-box { width: 22px; height: 22px; font-size: 0.75rem; border-radius: 7px; }
            .footer-motto { font-size: 0.78rem; }
            .days-badge { padding: 4px 12px; font-size: 0.72rem; }
        }
        .secret-gear { position: fixed; bottom: 16px; right: 16px; width: 40px; height: 40px; background: rgba(255,255,255,0.9); border-radius: 50%; display: none; align-items: center; justify-content: center; font-size: 20px; color: #5668dd; cursor: pointer; box-shadow: 0 4px 12px rgba(86,104,221,0.3); z-index: 900; transition: all 0.2s; border: 1px solid rgba(88,102,239,0.3); }
        .secret-gear:hover { background: #ffffff; transform: scale(1.05); }
        .secret-menu { position: fixed; bottom: 68px; right: 16px; background: #fff; border-radius: 20px; box-shadow: var(--shadow); display: none; flex-direction: column; padding: 6px 4px; z-index: 901; min-width: 130px; backdrop-filter: blur(8px); background: rgba(255,255,255,0.96); border: 1px solid rgba(88,102,239,0.2); }
        .secret-menu button { background: transparent; border: none; padding: 12px 18px; text-align: left; font-size: 0.9rem; color: #2c3e66; border-radius: 14px; cursor: pointer; width: 100%; transition: background 0.15s; }
        .secret-menu button:hover { background: #eef3ff; }
        .secret-file-input { display: none; }
        .fa-icon-mr { margin-right: 4px; }
        .fa-icon-ml { margin-left: 4px; }
        .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #24284f; color: #fff; padding: 8px 20px; border-radius: 30px; font-size: 0.85rem; opacity: 0; pointer-events: none; transition: opacity 0.35s; z-index: 2000; white-space: nowrap; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
        .toast.show { opacity: 1; }
        @media (max-width:640px) {
            main { padding: 2px; }
            .calendar, .summary, .chart-card { padding: 10px 2px; }
            .calendar-cell { min-width: 17px; font-size: .94em; height: 44px; }
            .inner-small { padding: 4px 10px; font-size: 0.85em; }
            .marquee-container marquee { font-size: 1em; }
            .top-capsule { margin: 6px 10px 12px 10px; }
            .modal { padding: 20px 16px; }
            .period-nav { gap: 6px; }
            .period-nav button { padding: 5px 10px; font-size: 0.82em; }
            canvas#trendChart { min-height: 200px; }
            .progress-icon { font-size: 16px; }
            .stats-columns { gap: 6px; }
            .stat-card .stat-hours { font-size: 1.4em; }
            .stat-card i { font-size: 1.3em; }
            .switch-option { padding: 4px 10px; font-size: 0.7rem; }
            .type-btn { font-size: 0.75rem; padding: 6px 0; }
        }
    </style>
</head>
<body>
<div class="top-capsule">
    <div class="inner-small" id="small-capsule"><i class="fas fa-hourglass-half"></i> <span id="total-hours-display">0h</span></div>
    <div class="marquee-container"><marquee id="header-slogan" direction="left" scrollamount="4" behavior="scroll"></marquee></div>
</div>

<main>
    <div class="progress-area">
        <div class="period-label" id="period-label"></div>
        <div class="period-nav"><button id="prev-period-btn"><i class="fas fa-chevron-left fa-icon-mr"></i>前一周期</button><button id="today-period-btn"><i class="fas fa-location-dot fa-icon-mr"></i>今天</button><button id="next-period-btn">后一周期<i class="fas fa-chevron-right fa-icon-ml"></i></button></div>
        <div class="progress-bg" id="progress-bg"><div class="progress-inner" id="progress-inner"></div><i id="progress-icon" class="fas fa-person-walking progress-icon"></i></div>
    </div>
    <section class="calendar" id="calendar"></section>
    <section class="summary" id="summary"><div class="stats-columns" id="stats-columns"></div><div class="total-row-salary" id="total-salary"></div></section>

    <div class="chart-card">
        <div class="chart-header">
            <div class="chart-title"><i class="fas fa-chart-line fa-icon-mr"></i>加班趋势</div>

<script>
    (function() {
        const PERIOD_DAYS = 31;
        const START_DATE = new Date(2026, 3, 22);

        function formatDateKey(date) { return [date.getFullYear(), String(date.getMonth()+1).padStart(2,'0'), String(date.getDate()).padStart(2,'0')].join('-'); }
        function isWeekend(date) { return date.getDay() === 0 || date.getDay() === 6; }
        function getDaysArray(start, end) { const arr=[]; let d=new Date(start); while(d<=end){ arr.push(new Date(d)); d.setDate(d.getDate()+1); } return arr; }
        function getCurrentPeriod(date=new Date()) { let year=date.getFullYear(), month=date.getMonth()+1, day=date.getDate(); let sYear=year, sMonth=month; if(day<21){ sMonth--; if(sMonth<1){ sMonth=12; sYear--; } } let start=new Date(sYear, sMonth-1, 21); let end=new Date(start); end.setDate(start.getDate()+PERIOD_DAYS-1); return {start,end}; }
        function getPeriodStartFromDate(date) { let year=date.getFullYear(), month=date.getMonth()+1; let day=date.getDate(); if(day<21){ month--; if(month<1){ month=12; year--; } } return new Date(year, month-1, 21); }
        function getPeriodKeyForDate(date) { return formatDateKey(getPeriodStartFromDate(date)); }

        const PRESET_PUBLIC_HOLIDAYS = { 2025: ['2025-01-01','2025-01-28','2025-01-29','2025-01-30','2025-04-05','2025-05-01','2025-06-19','2025-09-27','2025-10-01','2025-10-02','2025-10-03'], 2026: ['2026-01-01','2026-02-17','2026-02-18','2026-02-19','2026-04-05','2026-05-01','2026-06-19','2026-09-27','2026-10-01','2026-10-02','2026-10-03'], 2027: ['2027-01-01','2027-02-06','2027-02-07','2027-02-08','2027-04-05','2027-05-01','2027-06-09','2027-09-16','2027-10-01','2027-10-02','2027-10-03'] };
        const DAY_TYPE_OVERRIDE_KEY = 'dayTypeOverrides';
        function getDayTypeOverrides() { try { return JSON.parse(localStorage.getItem(DAY_TYPE_OVERRIDE_KEY) || '{}'); } catch(e){ return {}; } }
        function setDayTypeOverride(dateKey, type) { let map = getDayTypeOverrides(); if(type === null) delete map[dateKey]; else map[dateKey] = type; localStorage.setItem(DAY_TYPE_OVERRIDE_KEY, JSON.stringify(map)); }
        function getDayType(date) {
            let key = formatDateKey(date);
            let overrides = getDayTypeOverrides();
            if(overrides[key]) return overrides[key];
            if(isPublicHolidayFallback(date)) return 'publicholiday';
            if(isWeekend(date)) return 'holiday';
            return 'workday';
        }
        function isPublicHolidayFallback(date) {
            let key = formatDateKey(date);
            let h = PRESET_PUBLIC_HOLIDAYS[date.getFullYear()];
            return h ? h.includes(key) : false;
        }
        function getMultiplier(date) {
            let type = getDayType(date);
            if(type === 'publicholiday') return 3;
            if(type === 'holiday') return 2;
            return 1.5;
        }

        const STORAGE_KEY='overtime_v2';
        function saveData(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
        function loadData() { try { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'); } catch(e){ return {}; } }

        const PERIOD_WAGE_KEY='periodWageMap';
        function getPeriodWageMap() { try { return JSON.parse(localStorage.getItem(PERIOD_WAGE_KEY)||'{}'); } catch(e){ return {}; } }
        function savePeriodWageMap(map) { localStorage.setItem(PERIOD_WAGE_KEY, JSON.stringify(map)); }
        function getWageForDate(date) { let periodKey=getPeriodKeyForDate(date); let map=getPeriodWageMap(); let wage=map[periodKey]; return (wage && wage>0) ? wage : 30; }
        function setCurrentPeriodWage(wage) { let periodKey=formatDateKey(displayPeriod.start); let map=getPeriodWageMap(); map[periodKey]=wage; savePeriodWageMap(map); }
        function getCurrentPeriodWage() { let periodKey=formatDateKey(displayPeriod.start); let map=getPeriodWageMap(); return map[periodKey] ? map[periodKey] : 30; }

        let debugMode = false;
        let clickCount = 0, lastClickTime = 0;
        const topCapsule = document.querySelector('.top-capsule');
        function showDebugModeModal() {
            const modal = document.getElementById('debug-modal-mask');
            if(modal) {
                modal.style.display = 'flex';
                const confirmBtn = document.getElementById('debug-confirm-btn');
                const closeModal = () => { modal.style.display = 'none'; };
                const newBtn = confirmBtn.cloneNode(true);
                confirmBtn.parentNode.replaceChild(newBtn, confirmBtn);
                newBtn.addEventListener('click', closeModal);
                modal.addEventListener('click', (e) => { if(e.target === modal) e.stopPropagation(); });
            }
        }
        topCapsule.addEventListener('pointerdown', function(e) {
            const now = Date.now();
            if(!debugMode) {
                if(now - lastClickTime > 2500) clickCount = 1;
                else clickCount++;
                lastClickTime = now;
                if(clickCount >= 7){
                    debugMode = true;
                    clickCount = 0;
                    showDebugModeModal();
                    document.getElementById('secret-gear').style.display = 'flex';
                    render();
                    e.preventDefault();
                }
            }
        });
        function showToast(msg) { let t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

        let displayPeriod=getCurrentPeriod();
        function goToPeriod(startDate) { let end=new Date(startDate); end.setDate(startDate.getDate()+PERIOD_DAYS-1); displayPeriod={start:new Date(startDate), end}; render(); }
        function getPrevPeriodStart(cur) { let y=cur.getFullYear(), m=cur.getMonth()-1; if(m<0){ m=11; y--; } return new Date(y,m,21); }
        function getNextPeriodStart(cur) { let y=cur.getFullYear(), m=cur.getMonth()+1; if(m>11){ m=0; y++; } return new Date(y,m,21); }
        document.getElementById('prev-period-btn').onclick=()=>goToPeriod(getPrevPeriodStart(displayPeriod.start));
        document.getElementById('next-period-btn').onclick=()=>goToPeriod(getNextPeriodStart(displayPeriod.start));
        document.getElementById('today-period-btn').onclick=()=>{ displayPeriod=getCurrentPeriod(); render(); };

        let currentEditingKey = null;
        function setupFoldLogic() {
            const foldHeader = document.getElementById('fold-header');
            const foldContent = document.getElementById('fold-content');
            const foldIcon = document.getElementById('fold-icon');
            if(!foldHeader) return;
            foldHeader.onclick = () => {
                const isOpen = foldContent.classList.contains('open');
                if(isOpen) {
                    foldContent.classList.remove('open');
                    foldIcon.className = 'fas fa-chevron-down';
                } else {
                    foldContent.classList.add('open');
                    foldIcon.className = 'fas fa-chevron-up';
                }
            };
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.onclick = (e) => {
                    const type = btn.dataset.type;
                    if(type && currentEditingKey) {
                        setDayTypeOverride(currentEditingKey, type);
                        document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        showToast(`已设为 ${btn.innerText}`);
                        render();
                    }
                    e.stopPropagation();
                };
            });
        }

        window.onCellClick = function(key) {
            const mask = document.getElementById('modal-mask');
            const input = document.getElementById('modal-input-hours');
            const label = document.getElementById('modal-date-label');
            const date = new Date(key+'T00:00:00');
            currentEditingKey = key;
            const data = loadData();
            const existingHours = data[key]?.h || '';
            input.value = existingHours;
            let currentTypeObj = getDayType(date);
            let typeText = currentTypeObj === 'publicholiday' ? '国假·3倍' : (currentTypeObj === 'holiday' ? '假日·2倍' : '工作日·1.5倍');
            label.innerHTML = `${date.getFullYear()}-${date.getMonth()+1}-${date.getDate()}<br><span class="type-badge"><i class="fas fa-chart-simple"></i> 当前类型：${typeText}</span>`;
            const foldSection = document.getElementById('fold-section');
            if(debugMode) {
                foldSection.style.display = 'block';
                const overrideMap = getDayTypeOverrides();
                const currentOverride = overrideMap[key] || currentTypeObj;
                document.querySelectorAll('.type-btn').forEach(btn => {
                    if(btn.dataset.type === currentOverride) btn.classList.add('active');
                    else btn.classList.remove('active');
                });
                const foldContent = document.getElementById('fold-content');
                const foldIcon = document.getElementById('fold-icon');
                if(foldContent) {
                    foldContent.classList.remove('open');
                    if(foldIcon) foldIcon.className = 'fas fa-chevron-down';
                }
            } else {
                foldSection.style.display = 'none';
            }
            mask.style.display = 'flex';
            input.focus();
            window.modalSaveHandler = () => {
                let v = parseFloat(input.value) || 0;
                v = Math.max(0, v);
                if(!debugMode) {
                    let maxLimit = (currentTypeObj === 'publicholiday' || currentTypeObj === 'holiday') ? 8 : 4;
                    v = Math.min(maxLimit, v);
                }
                v = Math.round(v * 10) / 10;
                if(!data[key]) data[key] = {};
                v === 0 ? delete data[key].h : data[key].h = v;
                saveData(data);
                mask.style.display = 'none';
                render();
            };
            document.getElementById('modal-save-btn').onclick = window.modalSaveHandler;
            document.getElementById('modal-cancel-btn').onclick = () => { mask.style.display = 'none'; };
            input.onkeydown = e => { if(e.key === 'Enter') window.modalSaveHandler(); };
            mask.onclick = e => { if(e.target === mask) mask.style.display = 'none'; };
        };

        function drawSmoothCurve(ctx, points, lineColor, fillGradient, lineWidth, baseY) {
            if(points.length<2) return;
            let curvePoints = [];
            for(let i=0; i<points.length-1; i++) {
                const p0 = points[Math.max(0, i-1)];
                const p1 = points[i];
                const p2 = points[i+1];
                const p3 = points[Math.min(points.length-1, i+2)];
                for(let t=0; t<=1; t+=0.08) {
                    const t2 = t*t, t3 = t2*t;
                    const x = 0.5 * ((2*p1.x) + (-p0.x + p2.x)*t + (2*p0.x -5*p1.x +4*p2.x -p3.x)*t2 + (-p0.x +3*p1.x -3*p2.x +p3.x)*t3);
                    const y = 0.5 * ((2*p1.y) + (-p0.y + p2.y)*t + (2*p0.y -5*p1.y +4*p2.y -p3.y)*t2 + (-p0.y +3*p1.y -3*p2.y +p3.y)*t3);
                    curvePoints.push({x, y});
                }
            }
            curvePoints.push(points[points.length-1]);
            if(curvePoints.length===0) curvePoints = points;
            ctx.beginPath();
            ctx.moveTo(curvePoints[0].x, curvePoints[0].y);
            for(let i=1; i<curvePoints.length; i++) ctx.lineTo(curvePoints[i].x, curvePoints[i].y);
            ctx.strokeStyle = lineColor;
            ctx.lineWidth = lineWidth;
            ctx.stroke();
            ctx.lineTo(curvePoints[curvePoints.length-1].x, baseY);
            ctx.lineTo(curvePoints[0].x, baseY);
            ctx.closePath();
            ctx.fillStyle = fillGradient;
            ctx.fill();
        }
        function getCumulativeCurveUpToToday(start,end) {
            const today = new Date(); today.setHours(0,0,0,0);
            let days = getDaysArray(start,end).filter(d => d <= today);
            let data = loadData();
            let cumulative = 0, points = [];
            for(let d of days){
                let key = formatDateKey(d);
                let h = parseFloat(data[key]?.h)||0;
                cumulative += h;
                points.push({date: new Date(d), cumulative});
            }
            return points;
        }
        function getYearPeriodsUntilToday(refYear = new Date().getFullYear()) {
            let periods = [];
            let startOfYear = new Date(refYear,0,1);
            let curPeriodStart = getPeriodStartFromDate(startOfYear);
            let today = new Date(); today.setHours(0,0,0,0);
            let pStart = new Date(curPeriodStart);
            while(pStart.getFullYear() <= refYear) {
                if(pStart > today) break;
                let pEnd = new Date(pStart); pEnd.setDate(pStart.getDate() + PERIOD_DAYS - 1);
                let total = 0;
                let days = getDaysArray(pStart, pEnd);
                let ov = loadData();
                for(let d of days){
                    let key = formatDateKey(d);
                    total += parseFloat(ov[key]?.h)||0;
                }
                periods.push({start: new Date(pStart), end: pEnd, hours: total});
                let next = new Date(pStart);
                next.setMonth(pStart.getMonth() + 1);
                pStart = new Date(next.getFullYear(), next.getMonth(), 21);
                if(pStart.getFullYear() > refYear) break;
            }
            return periods;
        }
        let activeChartIndex = 0;
        function drawTrendChart() {
            let canvas = document.getElementById('trendChart');
            if(!canvas) return;
            let ctx = canvas.getContext('2d');
            let w = canvas.clientWidth, h = canvas.clientHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.scale(dpr, dpr);
            ctx.clearRect(0,0,w,h);
            const margin = {left: 16, right: 16, top: 18, bottom: 32};
            const graphW = w - margin.left - margin.right;
            const graphH = h - margin.top - margin.bottom;
            if(graphW <= 10) return;
            ctx.beginPath();
            ctx.strokeStyle = '#cbd6f0';
            ctx.lineWidth = 1;
            ctx.moveTo(margin.left, h - margin.bottom);
            ctx.lineTo(w - margin.right, h - margin.bottom);
            ctx.stroke();
            if(activeChartIndex === 0) {
                let pointsData = getCumulativeCurveUpToToday(displayPeriod.start, displayPeriod.end);
                if(pointsData.length === 0){
                    ctx.fillStyle = '#9aa3c0';
                    ctx.font = '13px "Segoe UI"';
                    ctx.textAlign = 'center';
                    ctx.fillText('📭 暂无记录', w/2, h/2);
                    document.getElementById('chartNote').innerHTML = '📈 月度累积走势';
                    return;
                }
                let maxCum = Math.max(...pointsData.map(p=>p.cumulative), 0.1);
                let xs = [];
                for(let i=0; i<pointsData.length; i++) {
                    let x = margin.left + (i / (pointsData.length-1)) * graphW;
                    let y = margin.top + graphH - (pointsData[i].cumulative / maxCum) * graphH;
                    xs.push({x, y, date: pointsData[i].date, val: pointsData[i].cumulative});
                }
                const grad = ctx.createLinearGradient(0, margin.top, 0, h - margin.bottom);
                grad.addColorStop(0, 'rgba(88,102,239,0.45)');
                grad.addColorStop(1, 'rgba(88,102,239,0.02)');
                drawSmoothCurve(ctx, xs, '#5866ef', grad, 2.6, h - margin.bottom);
                xs.forEach((pt, idx) => {
                    if(idx % Math.ceil(pointsData.length/5) === 0 || idx === pointsData.length-1){
                        ctx.fillStyle = '#2d3c9e';
                        ctx.font = '9px "Segoe UI"';
                        ctx.fillText(`${pt.date.getMonth()+1}/${pt.date.getDate()}`, pt.x-15, h - margin.bottom + 10);
                        ctx.fillStyle = '#4d60ad';
                        ctx.fillText(pt.val.toFixed(1)+'h', pt.x-8, pt.y-6);
                    }
                });
                document.getElementById('chartNote').innerHTML = '📈 本月累积时数';
            } else {
                let periods = getYearPeriodsUntilToday(new Date().getFullYear());
                if(periods.length === 0){
                    ctx.fillStyle = '#9aa3c0';
                    ctx.font = '13px "Segoe UI"';
                    ctx.fillText('📭 暂无数据', w/4, h/4);
                    document.getElementById('chartNote').innerHTML = '📆 本年加班时数';
                    return;
                }
                let maxH = Math.max(...periods.map(p=>p.hours), 0.1);
                let xs = [];
                for(let i=0; i<periods.length; i++) {
                    let x = margin.left + (i / (periods.length-1)) * graphW;
                    let y = margin.top + graphH - (periods[i].hours / maxH) * graphH;
                    xs.push({x, y, label: `${periods[i].start.getMonth()+1}/${periods[i].start.getDate()}`, hours: periods[i].hours});
                }
                const grad = ctx.createLinearGradient(0, margin.top, 0, h - margin.bottom);
                grad.addColorStop(0, 'rgba(247,163,92,0.45)');
                grad.addColorStop(1, 'rgba(247,163,92,0.02)');
                drawSmoothCurve(ctx, xs, '#f7a35c', grad, 2.6, h - margin.bottom);
                xs.forEach((pt, idx) => {
                    if(idx % Math.ceil(periods.length/5) === 0 || idx === periods.length-1){
                        ctx.fillStyle = '#c96b1a';
                        ctx.font = '9px "Segoe UI"';
                        ctx.fillText(pt.label, pt.x-15, h - margin.bottom + 10);
                        ctx.fillStyle = '#b85c0e';
                        ctx.fillText(pt.hours.toFixed(1)+'h', pt.x-8, pt.y-6);
                    }
                });
                document.getElementById('chartNote').innerHTML = '📆 本年各月加班时数';
            }
        }
        function initChartSwitch() {
            let btns = document.querySelectorAll('.switch-option');
            btns.forEach(btn => {
                btn.addEventListener('click', () => {
                    let idx = parseInt(btn.dataset.chart);
                    if(isNaN(idx)) return;
                    activeChartIndex = idx;
                    btns.forEach(b=>b.classList.remove('active'));
                    btn.classList.add('active');
                    drawTrendChart();
                });
            });
        }

        function renderCalendar(start,end,today){
            let days = getDaysArray(start,end);
            let html = ['<div class="calendar-header">'+["一","二","三","四","五","六","日"].map(d=>`<span>${d}</span>`).join('')+'</div>'];
            let blanks = (days[0].getDay()+6)%7;
            let cells = Array(blanks).fill('').concat(days);
            let data = loadData();
            let row = [];
            for(let i=0;i<cells.length;i++){
                if(typeof cells[i]==='string') row.push('<div class="calendar-cell cell-blank"></div>');
                else {
                    let d = cells[i], key = formatDateKey(d);
                    let overrideType = getDayTypeOverrides()[key];
                    let baseType = getDayType(d);
                    let effectiveType = overrideType || baseType;
                    let isToday = d.toDateString() === today.toDateString();
                    let h = data[key]?.h;
                    let bar = '', valShow = '';
                    if(h!=null && h>0){
                        let maxLimit = (effectiveType === 'publicholiday' || effectiveType === 'holiday') ? 8 : 4;
                        let frac = h/maxLimit;
                        if(debugMode && h>maxLimit) frac=1;
                        let widthPercent = Math.min(frac*100,100);
                        let cls = widthPercent>=99?'full':(widthPercent>66?'warn':'');
                        bar = `<div class="cell-ot-bar-bg"><div class="cell-ot-bar ${cls}" style="width:${widthPercent}%"></div></div>`;
                        valShow = `<div class="cell-ot-num">${h}h</div>`;
                    }
                    let overrideClass = '';
                    if(overrideType) overrideClass = `user-override-${overrideType}`;
                    let attrs = '';
                    if(effectiveType === 'publicholiday') attrs += ' data-pubholiday="1"';
                    else if(effectiveType === 'holiday' && !overrideType) attrs += ' data-weekend="1"';
                    let cls = (isToday?' today':'') + (overrideClass ? ' '+overrideClass : '');
                    let starIcons = (overrideType === 'publicholiday') ? `<i class="fas fa-star" style="position:absolute; top:-7px; right:-12px; font-size:0.5em; color:#f0803c;"></i>` : (overrideType === 'holiday' ? `<i class="fas fa-star" style="position:absolute; top:-7px; right:-12px; font-size:0.5em; color:#9a49fa;"></i>` : '');
                    row.push(`<div class="calendar-cell${cls}" data-datekey="${key}" ${attrs} onclick="onCellClick('${key}')"><div class="cell-date" style="position:relative;">${d.getDate()}${starIcons}</div>${bar}${valShow}</div>`);
                }
                if((i+1)%7===0 || i===cells.length-1){
                    html.push(`<div class="calendar-row">${row.join('')}</div>`);
                    row=[];
                }
            }
            document.getElementById('calendar').innerHTML = html.join('');
        }
        function updateSummaryColumns(start,end){
            let data=loadData();
            let tempH=0,holiH=0,pubH=0,tempFee=0,holiFee=0,pubFee=0;
            getDaysArray(start,end).forEach(d=>{
                let key=formatDateKey(d);
                let val=parseFloat(data[key]?.h)||0;
                if(!val) return;
                let wage=getWageForDate(d);
                let mult = getMultiplier(d);
                if(mult === 3) { pubH+=val; pubFee+=val*wage*3; }
                else if(mult === 2) { holiH+=val; holiFee+=val*wage*2; }
                else { tempH+=val; tempFee+=val*wage*1.5; }
            });
            let totalFee=tempFee+holiFee+pubFee;
            document.getElementById('stats-columns').innerHTML=`<div class="stat-card"><i class="fa-regular fa-moon"></i><div class="stat-label">临时加班</div><div class="stat-hours">${tempH.toFixed(1)}<span style="font-size:0.6rem;">h</span></div><div class="stat-multiplier">1.5倍</div></div><div class="stat-card"><i class="fa-regular fa-sun"></i><div class="stat-label">假日加班</div><div class="stat-hours">${holiH.toFixed(1)}h</div><div class="stat-multiplier">2倍</div></div><div class="stat-card"><i class="fas fa-landmark"></i><div class="stat-label">国假加班</div><div class="stat-hours">${pubH.toFixed(1)}h</div><div class="stat-multiplier">3倍</div></div>`;
            document.getElementById('total-salary').innerHTML=`<i class="fas fa-coins"></i> 加班薪资合计：<strong>￥${totalFee.toFixed(2)}</strong>`;
        }
        function updateHeaderContent(){
            let total=getDaysArray(displayPeriod.start,displayPeriod.end).reduce((acc,d)=>acc+(parseFloat(loadData()[formatDateKey(d)]?.h)||0),0);
            document.getElementById('total-hours-display').innerHTML=`${total.toFixed(1)}h`;
            let icons={zero:'<i class="fas fa-spa"></i>',low:'<i class="fas fa-walking"></i>',mid:'<i class="fas fa-chart-line"></i>',high:'<i class="fas fa-fire"></i>',extreme:'<i class="fas fa-skull-crossbones"></i>'};
            let msg='';
            if(total<=0) msg=`${icons.zero} 本周加班为0，享受久违的悠闲吧`;
            else if(total<10) msg=`${icons.low} 轻度加班，注意活动颈椎`;
            else if(total<20) msg=`${icons.mid} 中度加班${total.toFixed(1)}h，周末补觉`;
            else if(total<35) msg=`${icons.high} 高强度加班${total.toFixed(1)}h！安排休息`;
            else msg=`${icons.extreme} 极限爆肝！${total.toFixed(1)}h！健康第一`;
            document.getElementById('header-slogan').innerHTML=msg;
        }
        function updateFooterMotto() {
            const today = new Date(); today.setHours(0,0,0,0);
            const diffTime = today - START_DATE;
            const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
            const daysText = days >= 0 ? days : 0;
            document.getElementById('running-days-text').textContent = `本站已运行 ${daysText} 天`;

            const now = new Date();
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0);
            const data = loadData();
            let monthHours = 0;
            const daysInMonth = getDaysArray(monthStart, monthEnd);
            daysInMonth.forEach(d => {
                const key = formatDateKey(d);
                const h = parseFloat(data[key]?.h) || 0;
                monthHours += h;
            });

            const mottoEl = document.querySelector('.motto-text');
            if (!mottoEl) return;
            let suffix = '';
            if (monthHours > 30) {
                suffix = ' — 也为了记住疲惫的刻度。';
            } else if (monthHours === 0) {
                suffix = ' — 每一段轻松的时光也值得留档。';
            } else {
                suffix = ' — 数字背后，是无数个夜晚。';
            }
            mottoEl.innerHTML = `记录，是为了抵抗遗忘。${suffix}`;
        }
        function showWageInput(){
            let input = document.getElementById('hourly-wage');
            if(input) input.value = getCurrentPeriodWage().toFixed(2);
            const form = document.getElementById('wage-form');
            if(form) {
                form.onsubmit = (e) => {
                    e.preventDefault();
                    let v = parseFloat(document.getElementById('hourly-wage').value);
                    if(isNaN(v)) v = 30;
                    v = Math.max(0, v);
                    if(v > 0) setCurrentPeriodWage(v);
                    render();
                    return false;
                };
            }
        }
        function updateProgressIconPosition(){
            let inner=document.getElementById('progress-inner');
            let icon=document.getElementById('progress-icon');
            if(!inner||!icon) return;
            let w=inner.parentElement.clientWidth;
            let percent=parseFloat(inner.style.width)/100;
            let left=Math.min(1,Math.max(0,percent))*w;
            icon.style.left=left+'px';
        }
        function render(){
            renderCalendar(displayPeriod.start, displayPeriod.end, new Date());
            updateSummaryColumns(displayPeriod.start, displayPeriod.end);
            showWageInput();
            updateHeaderContent();
            updateFooterMotto();
            drawTrendChart();
            let totalDays = Math.round((displayPeriod.end-displayPeriod.start)/86400000)+1;
            let cur = Math.min(totalDays, Math.max(0, Math.round((new Date()-displayPeriod.start)/86400000)+1));
            let percent = (cur/totalDays)*100;
            document.getElementById('progress-inner').style.width = `${percent}%`;
            setTimeout(updateProgressIconPosition,10);
            document.getElementById('period-label').innerHTML = `考勤周期：${displayPeriod.start.getFullYear()}/${displayPeriod.start.getMonth()+1}/${displayPeriod.start.getDate()} - ${displayPeriod.end.getFullYear()}/${displayPeriod.end.getMonth()+1}/${displayPeriod.end.getDate()}`;
        }
        window.addEventListener('resize',()=>drawTrendChart());
        document.getElementById('progress-inner').addEventListener('transitionend',updateProgressIconPosition);
        initChartSwitch();
        setupFoldLogic();
        render();

        const gear = document.getElementById('secret-gear'), menu = document.getElementById('secret-menu'), fileInput = document.getElementById('secret-file-input');
        gear.addEventListener('click', (e) => { e.stopPropagation(); menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex'; });
        document.addEventListener('click', () => { menu.style.display = 'none'; });
        menu.addEventListener('click', (e) => e.stopPropagation());
        document.getElementById('backup-btn').addEventListener('click', () => {
            let data = { overtime: loadData(), dayTypeOverrides: getDayTypeOverrides(), periodWageMap: getPeriodWageMap() };
            let json = JSON.stringify(data); let blob = new Blob([json], { type: 'application/json' }); let a = document.createElement('a');
            a.download = `加班备份_${new Date().toISOString().slice(0,10)}.json`; a.href = URL.createObjectURL(blob); a.click(); URL.revokeObjectURL(a.href);
            showToast('数据已备份'); menu.style.display = 'none';
        });
        document.getElementById('restore-btn').addEventListener('click', () => { fileInput.click(); });
        fileInput.addEventListener('change', e => {
            let file = e.target.files[0]; if (!file) return; let reader = new FileReader();
            reader.onload = ev => {
                try {
                    let backup = JSON.parse(ev.target.result);
                    if (backup.overtime) saveData(backup.overtime);
                    if (backup.dayTypeOverrides) localStorage.setItem(DAY_TYPE_OVERRIDE_KEY, JSON.stringify(backup.dayTypeOverrides));
                    if (backup.periodWageMap) localStorage.setItem(PERIOD_WAGE_KEY, JSON.stringify(backup.periodWageMap));
                    showToast('数据已恢复'); setTimeout(() => location.reload(), 500);
                } catch (ex) { alert('文件格式不正确'); }
            };
            reader.readAsText(file);
            fileInput.value = '';
        });
    })();
</script>
</body>
</html>
